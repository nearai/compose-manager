[package]
name = "compose-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
subtle = "2.5"
dstack-sdk-types = { git = "https://github.com/Dstack-TEE/dstack" }
http-client-unix-domain-socket = "0.1.1"
# TLS on the API port (src/tls.rs). ring backend: already in the dependency
# tree, and needs no extra build tooling.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
rcgen = "0.13"
