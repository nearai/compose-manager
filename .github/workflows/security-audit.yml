name: Security audit

on:
  push:
    branches:
      - 'main'
  pull_request:
  schedule:
    # Daily at midnight UTC. Matches the cadence used by nearai/cloud-api
    # so RUSTSEC advisories surface within a day of publication.
    - cron: '0 0 * * *'

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
