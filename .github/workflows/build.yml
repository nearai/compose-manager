name: Build & Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  REGISTRY: docker.io
  IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/compose-manager
  LAUNCHER_IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/compose-manager-launcher
  DASHBOARD_IMAGE_REPOSITORY: ${{ vars.DOCKER_REGISTRY_USER }}/compose-manager-dashboard

jobs:
  reproducible-docker-image:
    name: Reproducible Docker Image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker registry
        uses: docker/login-action@0567fa5ae8c9a197cb207537dc5cbb43ca3d803f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract image tag from GitHub ref (branch or tag)
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            TAG=${GITHUB_REF_NAME#v}
            echo "Using '${TAG}' image tag for ${GITHUB_REF_NAME} tag"
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            TAG=$(if [[ "${GITHUB_REF_NAME}" == 'master' ]]; then echo 'staging'; else echo 'dev'; fi)
            echo "Using '${TAG}' image tag for ${GITHUB_REF_NAME} branch"
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi

          if [ -z "${TAG}" ]; then
            echo "Unable to parse image tag from ${GITHUB_REF_TYPE}: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "IMAGE_REFERENCE=${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}:${TAG}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Build and push reproducible image
        run: |
          ./build-image.sh --push "${{ env.IMAGE_REFERENCE }}"

      - name: Get image digest
        run: |
          DIGEST=$(skopeo inspect oci-archive:./oci.tar | jq -r '.Digest')
          if [ -z "${DIGEST}" ]; then
            echo "Failed to get image digest from OCI archive" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_REPOSITORY }}@${{ env.IMAGE_DIGEST }}"

      - name: Generate build summary
        run: |
          {
            echo "## compose-manager docker image"
            echo ""
            echo "- tag: \`${{ env.IMAGE_REFERENCE }}\`"
            echo "- digest: \`${{ env.IMAGE_DIGEST }}\`"
            echo "- sigstore: https://search.sigstore.dev/?hash=${{ env.IMAGE_DIGEST }}"
          } >> "$GITHUB_STEP_SUMMARY"

  launcher-image:
    name: Launcher Docker Image
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker registry
        uses: docker/login-action@0567fa5ae8c9a197cb207537dc5cbb43ca3d803f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract image tag from GitHub ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            TAG=${GITHUB_REF_NAME#v}
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            TAG=$(if [[ "${GITHUB_REF_NAME}" == 'master' ]]; then echo 'staging'; else echo 'dev'; fi)
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          echo "LAUNCHER_IMAGE_REFERENCE=${{ env.REGISTRY }}/${{ env.LAUNCHER_IMAGE_REPOSITORY }}:${TAG}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push launcher image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./launcher
          push: true
          tags: ${{ env.LAUNCHER_IMAGE_REFERENCE }}
          platforms: linux/amd64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d07f1d8e8f0afacf  # v3.8.2

      - name: Sign launcher image with cosign (keyless)
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.LAUNCHER_IMAGE_REPOSITORY }}@${{ steps.build.outputs.digest }}"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.LAUNCHER_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate build summary
        run: |
          {
            echo "## compose-manager-launcher docker image"
            echo ""
            echo "- tag: \`${{ env.LAUNCHER_IMAGE_REFERENCE }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- sigstore: https://search.sigstore.dev/?hash=${{ steps.build.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

  dashboard-image:
    name: Dashboard Docker Image
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker registry
        uses: docker/login-action@0567fa5ae8c9a197cb207537dc5cbb43ca3d803f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      - name: Extract image tag from GitHub ref
        run: |
          if [[ "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            TAG=${GITHUB_REF_NAME#v}
          elif [[ "${GITHUB_REF_TYPE}" == 'branch' ]]; then
            TAG=$(if [[ "${GITHUB_REF_NAME}" == 'master' ]]; then echo 'staging'; else echo 'dev'; fi)
          else
            echo "Unsupported ref type: ${GITHUB_REF_TYPE}" >&2
            exit 1
          fi
          echo "DASHBOARD_IMAGE_REFERENCE=${{ env.REGISTRY }}/${{ env.DASHBOARD_IMAGE_REPOSITORY }}:${TAG}" >> "$GITHUB_ENV"

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ env.DASHBOARD_IMAGE_REFERENCE }}

      - name: Generate build summary
        run: |
          {
            echo "## compose-manager-dashboard docker image"
            echo ""
            echo "- tag: \`${{ env.DASHBOARD_IMAGE_REFERENCE }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
